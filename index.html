<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYRO — Wear Your Vision</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }
    .hero {
  min-height: 520px;
  background:
    linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
    url("hero.jpg") center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  padding: 40px 20px;
}

.hero-content h1 {
  font-size: 56px;
  letter-spacing: 8px;
  margin-bottom: 15px;
}

.hero-content p {
  font-size: 18px;
  letter-spacing: 4px;
  margin-bottom: 30px;
}

.hero-btn {
  display: inline-block;
  background: white;
  color: #111;
  padding: 14px 30px;
  border-radius: 7px;
  text-decoration: none;
  font-weight: bold;
  transition: .2s;
}

.hero-btn:hover {
  background: #ddd;
}
    header h1 {
      font-size: 34px;
      letter-spacing: 4px;
    }
    header p {
      margin-top: 8px;
      letter-spacing: 2px;
      color: #ccc;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }
    .top-bar h2 {
      font-size: 25px;
    }
    .cart-button {
      background: #111;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    .products {
      max-width: 1200px;
      margin: auto;
      padding: 10px 20px 50px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
    }
    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }
    .product-image {
  height: 300px;
  background: #f2f2f2;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
    .product-info {
      padding: 18px;
    }
    .product-info h3 {
      margin-bottom: 8px;
    }
    .price {
      font-weight: bold;
      font-size: 19px;
      margin-bottom: 15px;
    }
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
    }
    .add-btn {
      width: 100%;
      padding: 12px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
    }
    .add-btn:hover,
    .cart-button:hover {
      opacity: .8;
    }
    .cart {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 1000;
    }
    .cart-box {
      background: white;
      width: min(500px, 92%);
      max-height: 85vh;
      overflow-y: auto;
      margin: 7vh auto;
      border-radius: 12px;
      padding: 25px;
    }
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .close {
      border: none;
      background: none;
      font-size: 28px;
      cursor: pointer;
    }
    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }
    .cart-item strong {
      display: block;
      margin-bottom: 5px;
    }
    .cart-total {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
    }
    .whatsapp {
      display: block;
      width: 100%;
      text-align: center;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 25px;
      background: #111;
      color: #aaa;
    }
    @media (max-width: 600px) {
      header h1 {
        font-size: 28px;
      }
      .product-image {
        height: 260px;
      }
    }
  </style>
</head>
<body>
<header>
  <h1>VYRO</h1>
  <p>WEAR YOUR VISION</p>
</header>
<div class="top-bar">
  <h2>Products</h2>
  <button class="cart-button" onclick="openCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</div>
<section class="products">
  <div class="product">
<div class="product-image">
  <img src="IMG_8035.jpeg" alt="VYRO Essential T-Shirt">
</div>
    <div class="product-info">
      <h3>VYRO Essential T-Shirt</h3>
      <div class="price">499 EGP</div>
      <select id="color1">
        <option>Black</option>
        <option>White</option>
        <option>Grey</option>
      </select>
      <select id="size1">
        <option>M</option>
        <option>L</option>
        <option>XL</option>
        <option>XXL</option>
      </select>
      <button class="add-btn"
        onclick="addToCart('VYRO Essential T-Shirt',499,'color1','size1')">
        Add to Cart
      </button>
    </div>
  </div>
  <div class="product">
   <div class="product-image">
  <img src="IMG_8036.jpeg" alt="VYRO Oversized T-Shirt">
</div>
    <div class="product-info">
      <h3>VYRO Oversized T-Shirt</h3>
      <div class="price">599 EGP</div>
      <select id="color2">
        <option>Black</option>
        <option>White</option>
        <option>Beige</option>
      </select>
      <select id="size2">
        <option>M</option>
        <option>L</option>
        <option>XL</option>
        <option>XXL</option>
      </select>
      <button class="add-btn"
        onclick="addToCart('VYRO Oversized T-Shirt',599,'color2','size2')">
        Add to Cart
      </button>
    </div>
  </div>
  <div class="product">
    <div class="product-image">
  <img src="IMG_8037.jpeg" alt="VYRO Hoodie">
</div>
    <div class="product-info">
      <h3>VYRO Hoodie</h3>
      <div class="price">899 EGP</div>
      <select id="color3">
        <option>Black</option>
        <option>Grey</option>
        <option>Off White</option>
      </select>
      <select id="size3">
        <option>M</option>
        <option>L</option>
        <option>XL</option>
        <option>XXL</option>
      </select>
      <button class="add-btn"
        onclick="addToCart('VYRO Hoodie',899,'color3','size3')">
        Add to Cart
      </button>
    </div>
  </div>
  <div class="product">
<div class="product-image">
  <img src="IMG_8038.jpeg" alt="VYRO Cargo Pants">
</div>
    <div class="product-info">
      <h3>VYRO Cargo Pants</h3>
      <div class="price">799 EGP</div>
      <select id="color4">
        <option>Black</option>
        <option>Olive</option>
        <option>Beige</option>
      </select>
      <select id="size4">
        <option>M</option>
        <option>L</option>
        <option>XL</option>
        <option>XXL</option>
      </select>
      <button class="add-btn"
        onclick="addToCart('VYRO Cargo Pants',799,'color4','size4')">
        Add to Cart
      </button>
    </div>
  </div>
</section>
<div class="cart" id="cart">
  <div class="cart-box">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close" onclick="closeCart()">×</button>
    </div>
    <div id="cartItems">
      Your cart is empty.
    </div>
    <div class="cart-total">
      Total: <span id="cartTotal">0</span> EGP
    </div>
    <a id="whatsappBtn"
       class="whatsapp"
       href="#"
       target="_blank">
      Order via WhatsApp
    </a>
  </div>
</div>
<footer>
  © VYRO — All rights reserved.
</footer>
<script>
  let cart = [];
  function addToCart(name, price, colorId, sizeId) {
    const color = document.getElementById(colorId).value;
    const size = document.getElementById(sizeId).value;
    cart.push({
      name: name,
      price: price,
      color: color,
      size: size
    });
    updateCart();
    alert(name + " added to cart!");
  }
  function updateCart() {
    const cartItems = document.getElementById("cartItems");
    const cartCount = document.getElementById("cartCount");
    const cartTotal = document.getElementById("cartTotal");
    cartCount.innerText = cart.length;
    if (cart.length === 0) {
      cartItems.innerHTML = "Your cart is empty.";
      cartTotal.innerText = "0";
      return;
    }
    let html = "";
    let total = 0;
    cart.forEach((item, index) => {
      total += item.price;
      html += `
        <div class="cart-item">
          <strong>${item.name}</strong>
          Color: ${item.color}<br>
          Size: ${item.size}<br>
          Price: ${item.price} EGP
          <br><br>
          <button onclick="removeItem(${index})">
            Remove
          </button>
        </div>
      `;
    });
    cartItems.innerHTML = html;
    cartTotal.innerText = total;
    updateWhatsApp(total);
  }
  function removeItem(index) {
    cart.splice(index, 1);
    updateCart();
  }
  function openCart() {
    document.getElementById("cart").style.display = "block";
  }
  function closeCart() {
    document.getElementById("cart").style.display = "none";
  }
  function updateWhatsApp(total) {
    let message = "Hello VYRO! I would like to order:%0A%0A";
    cart.forEach((item, index) => {
      message +=
        (index + 1) +
        ". " +
        item.name +
        "%0A" +
        "Color: " +
        item.color +
        "%0A" +
        "Size: " +
        item.size +
        "%0A" +
        "Price: " +
        item.price +
        " EGP%0A%0A";
    });
    message += "Total: " + total + " EGP";
    /*
      IMPORTANT:
      Replace 201000000000 with your real WhatsApp number.
      Use country code without +.
      Example Egypt: 201XXXXXXXXX
    */
    const phone = "201129327133";
    document.getElementById("whatsappBtn").href =
      "https://wa.me/" + phone + "?text=" + message;
  }
</script>
</body>
</html>
